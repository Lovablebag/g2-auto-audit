<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overview · G2 Travel</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--blue:#1A7DC4;--navy:#0f2c5b;--bg:#f4f6f9;--card:#fff;--text:#1a1a2e;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--bad:#dc2626;--radius:10px}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--line:#334155}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.upload-zone{border:2px dashed var(--line);border-radius:var(--radius);padding:12px 16px;text-align:center;cursor:pointer}
.upload-zone:hover{border-color:var(--blue)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.field select,.field input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);min-width:140px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi .v{font-size:20px;font-weight:700}
.kpi .l{font-size:11px;color:var(--muted)}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:transparent;cursor:pointer;color:var(--text)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
table.rbt{font-size:12px}
table.rbt th,table.rbt td{padding:8px 5px}
table.rbt td:nth-child(3),table.rbt td:nth-child(4),table.rbt td:nth-child(6),table.rbt td:nth-child(8),table.rbt td:nth-child(10),table.rbt td:nth-child(11),table.rbt td:last-child{white-space:nowrap}
.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
.msg{padding:10px;border-radius:6px;background:#ecfdf5;color:#065f46;margin-bottom:12px}
.msg.err{background:#fef2f2;color:#991b1b}
.hidden{display:none}
.chart-box{height:220px;margin:12px 0}
.chart-box.tall{height:320px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--blue);width:0;transition:width .2s}
</style>
<link rel="stylesheet" href="./nav.css">
</head>
<body>
<header class="header" id="g2-header" data-page="region"></header>
<script src="./nav.js"></script>
<div class="main">
  <div id="upload-card" class="card">
    <h2 style="margin:0 0 8px">Overview</h2>
    <p style="color:var(--muted);margin:0 0 16px">Drop the folder with the 9 files (4 Daily Creations, 3 Availability, Rate Plan, Offer Details).</p>
    <div class="upload-zone" id="drop">
      <div style="font-weight:600">📁 Drop the folder here or click to browse</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">4 Daily Creations · 3 Availability · Rate Plan · Offer Details</div>
      <input type="file" id="files" webkitdirectory multiple accept=".csv,.xlsx" style="display:none">
    </div>
    <div class="progress hidden" id="prog"><div></div></div>
    <div id="msg"></div>
  </div>
  <div id="dash" class="hidden">
    <div class="card">
      <div class="filters">
        <div class="field"><label>Country</label><select id="f-country"><option value="">All</option></select></div>
        <div class="field"><label>Master City</label><select id="f-master"><option value="">All</option></select></div>
        <div class="field"><label>City</label><select id="f-city"><option value="">All</option></select></div>
        <div class="field"><label>Property</label><select id="f-prop"><option value="">All</option></select></div>
        <div class="field"><label>Status</label><select id="f-status"><option value="">All</option><option value="Confirmed">Confirmed</option></select></div>
        <div class="field"><label>Contract</label><select id="f-contract"><option value="">All</option><option value="Static">Static</option><option value="Margin">Margin</option><option value="Dynamic">Dynamic</option><option value="Direct">Direct</option></select></div>
        <div class="field"><label>Compare vs</label><select id="cmp-type"><option value="">None</option><option value="master">Master City</option><option value="city">City</option><option value="prop">Property</option></select></div>
        <div class="field"><label>&nbsp;</label><select id="cmp-val" disabled><option value="">Select…</option></select></div>
        <button class="btn btn-primary" id="btn-audit" disabled>Audit property</button>
        <button class="btn btn-secondary" id="btn-reset">Reset</button>
        <button class="btn btn-secondary" id="btn-report" title="PowerPoint with every tab for the current selection">⬇ Download report</button>
        
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div id="tab-body"></div>
    </div>
  </div>
</div>
</div>
<script>
const $ = s => document.querySelector(s);
// Current calendar year (YTD) vs previous year: every year shown or filtered below derives from these.
const CUR_YEAR = new Date().getFullYear(), PREV_YEAR = CUR_YEAR - 1;
const CUR_S = String(CUR_YEAR), PREV_S = String(PREV_YEAR);
const S = {sales:[], avail:[], plans:[], offers:[], filters:{country:'',master:'',city:'',prop:'',status:'',contract:''}, cmp:{type:'',val:''}, tab:'sales'};
const TABS = ['Sales','Pick-up','Distributions','Cancellations','Allotment','Weekday','Demand','Offers','Rebook'];

$('#dark-toggle').onclick = () => { const d = document.body.classList.toggle('dark'); $('#dark-toggle').textContent = d ? '\u2600\uFE0F Light' : '\uD83C\uDF19 Dark'; };
$('#drop').onclick = () => $('#files').click();
$('#drop').ondragover = e => { e.preventDefault(); };
$('#drop').ondrop = e => { e.preventDefault(); handleFiles(e.dataTransfer.files); };
$('#files').onchange = e => handleFiles(e.target.files);

async function handleFiles(fileList, opts){
  opts=opts||{};
  const files = [...fileList];
  const sales = files.filter(f => /daily.creations/i.test(f.name) && f.name.endsWith('.csv'));
  const avail = files.filter(f => /availability/i.test(f.name) && f.name.endsWith('.csv'));
  const rp = files.find(f => /rate.plan/i.test(f.name));
  const od = files.find(f => /offer.details/i.test(f.name));
  if(!sales.length || !avail.length || !rp || !od){
    msg('Need Daily Creations, Availability, Rate Plan and Offer Details.','err'); return;
  }
  S.sales=[]; S.avail=[]; S.plans=[]; S.offers=[];
  S.filters={country:'',master:'',city:'',prop:'',status:'',contract:''}; S.cmp={type:'',val:''};
  ['f-country','f-master','f-city','f-prop','f-status','f-contract','cmp-type','cmp-val'].forEach(id=>{ const el=$('#'+id); if(el) el.value=''; });
  msg('Reading '+files.length+' files…');
  $('#prog').classList.remove('hidden');
  const total = sales.length + avail.length + 2;
  let done = 0;
  const tick = () => { done++; $('#prog div').style.width = Math.round(done/total*100)+'%'; };
  for(const f of sales){ for(const r of await parseCSV(f)) S.sales.push(r); tick(); }
  for(const f of avail){ for(const r of await parseCSV(f)) S.avail.push(r); tick(); }
  S.plans = await parseXLSX(rp, 'Contract ID'); tick();
  S.offers = await parseXLSX(od, 'Contract ID'); tick();
  msg(S.sales.length.toLocaleString()+' sales rows · '+S.avail.length.toLocaleString()+' availability rows · '+S.plans.length+' rate plans · '+S.offers.length+' offers');
  const badDates = S.sales.filter(r=>!/^\d{4}-\d{2}-\d{2}/.test(r['Created (UTC)']||'')).length;
  if(badDates) msg($('#msg').textContent+' — ⚠ '+badDates.toLocaleString()+' rows have an unreadable creation date and are excluded from the year figures.','err');
  buildFilters();
  $('#files').value='';
  if(!opts.fromCache){ cacheSave(sales.concat(avail,[rp,od])).then(()=>noteMsg('Saved for today · <a href="#" onclick="clearSaved();return false">Clear</a>')).catch(e=>noteMsg('Could not save for later ('+(e&&e.name||e)+')')); }
  $('#dash').classList.remove('hidden');
  render();
}

function parseCSV(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => {
      const lines = r.result.split(/\r?\n/);
      const head = splitCSV(lines[0]).map((h,i)=>i?h:h.replace(/^\uFEFF/,''));
      const rows = [];
      for(let i=1;i<lines.length;i++){
        if(!lines[i]) continue;
        const c = splitCSV(lines[i]);
        const o = {};
        head.forEach((h,j)=> o[h]=c[j]||'');
        rows.push(o);
      }
      normDates(rows);
      res(rows);
    };
    r.onerror = rej;
    r.readAsText(file);
  });
}
const DATE_COLS=['Created (UTC)','Check-In','Check-Out','Date'];
// Accept dd/mm/yyyy, dd.mm.yyyy, dd-mm-yyyy or mm/dd/yyyy (auto-detected per file; dd/mm if ambiguous) and convert to ISO.
function normDates(rows){
  const re=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(.*)$/;
  DATE_COLS.forEach(col=>{
    let mdy=false;
    for(const r of rows){ const m=re.exec(r[col]||''); if(m){ if(+m[1]>12){ mdy=false; break; } if(+m[2]>12){ mdy=true; break; } } }
    for(const r of rows){ const m=re.exec(r[col]||''); if(!m) continue;
      const d=mdy?m[2]:m[1], mo=mdy?m[1]:m[2];
      r[col]=m[3]+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0')+m[4]; }
  });
}
function splitCSV(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; }
  }
  out.push(cur); return out;
}
function parseXLSX(file, headerKey){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => {
      const wb = XLSX.read(r.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      let hi = rows.findIndex(row => row.some(c => String(c).trim()===headerKey));
      if(hi<0) hi=0;
      const head = rows[hi].map(c=>String(c).trim());
      const out = [];
      for(let i=hi+1;i<rows.length;i++){
        if(!rows[i].some(c=>c!=='')) continue;
        const o={};
        head.forEach((h,j)=>{ if(h) o[h]=rows[i][j]; });
        out.push(o);
      }
      res(out);
    };
    r.onerror = rej;
    r.readAsBinaryString(file);
  });
}
function msg(t,k){ $('#msg').innerHTML = '<div class="msg'+(k==='err'?' err':'')+'">'+t+'</div>'; }

function buildFilters(){
  const countries = uniq(S.sales.map(r=>r.Country));
  fill($('#f-country'), countries);
  cascade();
}
function cascade(){
  const f = S.filters;
  const base = S.sales.filter(r => (!f.country||r.Country===f.country));
  fill($('#f-master'), uniq(base.map(r=>r['Master City'])));
  const b2 = base.filter(r => (!f.master||r['Master City']===f.master));
  fill($('#f-city'), uniq(b2.map(r=>r.City)));
  const b3 = b2.filter(r => (!f.city||r.City===f.city));
  fill($('#f-prop'), uniq(b3.map(r=>r.Property)));
}
function fill(sel, vals){
  const cur = sel.value;
  sel.innerHTML = '<option value="">All</option>' + vals.filter(Boolean).sort().map(v=>'<option>'+esc(v)+'</option>').join('');
  if(vals.includes(cur)) sel.value = cur;
}
function uniq(a){ return [...new Set(a)]; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

['f-country','f-master','f-city','f-prop','f-status','f-contract'].forEach(id=>{
  $('#'+id).onchange = () => {
    S.filters.country = $('#f-country').value;
    S.filters.master = $('#f-master').value;
    S.filters.city = $('#f-city').value;
    S.filters.prop = $('#f-prop').value;
    S.filters.status = $('#f-status').value;
    S.filters.contract = $('#f-contract').value;
    if(id!=='f-prop' && id!=='f-status' && id!=='f-contract') cascade();
    $('#btn-audit').disabled = !S.filters.prop;
    render();
  };
});
$('#cmp-type').onchange = () => {
  S.cmp.type = $('#cmp-type').value;
  const sel = $('#cmp-val');
  sel.disabled = !S.cmp.type;
  if(!S.cmp.type){ sel.innerHTML='<option value="">Select…</option>'; S.cmp.val=''; render(); return; }
  const key = S.cmp.type==='master'?'Master City':S.cmp.type==='city'?'City':'Property';
  fill(sel, uniq(S.sales.map(r=>r[key])));
  sel.querySelector('option').textContent = 'Select '+S.cmp.type+'…';
};
$('#cmp-val').onchange = () => { S.cmp.val = $('#cmp-val').value; render(); };

function filtered(rows, key){
  const f = S.filters;
  return rows.filter(r =>
    (!f.country || r.Country===f.country) &&
    (!f.master || r['Master City']===f.master) &&
    (!f.city || r.City===f.city) &&
    (!f.prop || r.Property===f.prop) &&
    (!f.status || r.Status===f.status) &&
    contractOk(r, f.contract)
  );
}
function contractOk(r, c){
  if(!c) return true;
  const ct = r.Contract || '';
  if(c==='Static' || c==='Margin') return ct===c;
  if(c==='Direct') return ct==='Margin' || ct==='Static';
  if(c==='Dynamic'){
    if(ct!=='Dynamic') return false;
    const s = (r.Source||'').toLowerCase();
    return s.includes('synxis') || s.includes('hyperguest marketplace');
  }
  return true;
}
function cmpRows(){
  if(!S.cmp.type || !S.cmp.val) return null;
  const key = S.cmp.type==='master'?'Master City':S.cmp.type==='city'?'City':'Property';
  return S.sales.filter(r => r[key]===S.cmp.val);
}
// Same rule as Auto Audit: any status other than "Confirmed" (Cancelled, Booked Out, Book Out, Rejected, Error, ...) counts as cancelled.
function isCancelled(r){ const t=String(r.Status||'').trim().toLowerCase(); return t!=='' && t!=='confirmed'; }
function kpis(rows){
  const bookings = new Map();
  let rn=0, cost=0, cancelled=0, confirmed=0;
  rows.forEach(r=>{
    const id=r['Booking ID'];
    if(!bookings.has(id)) bookings.set(id,0);
    bookings.set(id, bookings.get(id)+1);
    rn += Number(r.Nights)||0;
    cost += Number(r.Cost)||0;
    if(isCancelled(r)) cancelled++; else confirmed++;
  });
  const multi = [...bookings.values()].filter(n=>n>1).length;
  const total = bookings.size;
  return {rn, cost, adr: rn? cost/rn : 0, cancelPct: rows.length? cancelled/rows.length*100 : 0, multi, bookings: total, rows: rows.length};
}
function baseline(){
  const cmp = cmpRows();
  if(cmp){
    const yCur = cmp.filter(r=>(r['Created (UTC)']||'').startsWith(CUR_S));
    return {rows: yCur, label: S.cmp.val+' '+CUR_YEAR};
  }
  return null;
}
function render(){
  const rows = filtered(S.sales);
  const yPrev = rows.filter(r=>(r['Created (UTC)']||'').startsWith(PREV_S));
  const yCur = rows.filter(r=>(r['Created (UTC)']||'').startsWith(CUR_S));
  const aCur = kpis(yCur);
  const base = baseline();
  const aBase = base ? kpis(base.rows) : kpis(yPrev);
  const baseLabel = base ? base.label : PREV_S;
  const cards = [
    ['Room nights '+baseLabel, aBase.rn.toLocaleString(), null],
    ['Room nights '+CUR_YEAR+' YTD', aCur.rn.toLocaleString(), delta(aCur.rn, aBase.rn)],
    ['Cost '+baseLabel, '€'+Math.round(aBase.cost).toLocaleString(), null],
    ['Cost '+CUR_YEAR+' YTD', '€'+Math.round(aCur.cost).toLocaleString(), delta(aCur.cost, aBase.cost)],
    ['ADR '+CUR_YEAR, '€'+aCur.adr.toFixed(0), delta(aCur.adr, aBase.adr)],
    ['Cancel rate '+CUR_YEAR+' (% of lines)', aCur.cancelPct.toFixed(1)+'%', delta(aCur.cancelPct, aBase.cancelPct, true)],
    ['Multi-room '+CUR_YEAR, aCur.multi.toLocaleString(), null],
    ['Bookings '+CUR_YEAR, aCur.bookings.toLocaleString(), delta(aCur.bookings, aBase.bookings)]
  ];
  $('#kpis').innerHTML = cards.map(([l,v,d])=>'<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(d?'<div class="d '+d.cls+'">'+d.txt+'</div>':'')+'</div>').join('');
  renderTabs(rows);
}
function delta(a,b,lowerBetter){
  if(!b) return null;
  const d = b ? (a-b)/b*100 : 0;
  const good = lowerBetter ? d<0 : d>0;
  return {txt:(d>0?'+':'')+d.toFixed(1)+'%', cls: good?'up':'down'};
}
function destroyCharts(){ if(window.Chart && Chart.instances) Object.values(Chart.instances).forEach(c=>c.destroy()); }
function renderTabs(rows){
  destroyCharts();
  $('#tabs').innerHTML = TABS.map(t=>'<button class="tab'+(S.tab===t.toLowerCase()?' on':'')+'" data-t="'+t.toLowerCase()+'">'+t+'</button>').join('');
  $('#tabs').onclick = e => { if(e.target.dataset.t){ S.tab=e.target.dataset.t; renderTabs(rows); } };
  const body = $('#tab-body');
  if(S.tab==='sales') salesView(rows);
  else if(S.tab==='pick-up') pickupView(rows);
  else if(S.tab==='distributions') body.innerHTML = distTable(rows);
  else if(S.tab==='cancellations') cancelView(rows);
  else if(S.tab==='allotment') body.innerHTML = allotTable();
  else if(S.tab==='weekday') weekdayView(rows);
  else if(S.tab==='demand') demandView(rows);
  else if(S.tab==='rebook') rebookView();
  else offersView();
}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function byYearMonth(rows, dateKey){
  const yPrev=Array(12).fill(0), yCur=Array(12).fill(0);
  rows.forEach(r=>{
    const d=new Date(r[dateKey]); if(isNaN(d)) return;
    const y=d.getFullYear(), m=d.getMonth();
    const n=Number(r.Nights)||0;
    if(y===PREV_YEAR) yPrev[m]+=n; else if(y===CUR_YEAR) yCur[m]+=n;
  });
  return {yPrev,yCur};
}
function salesView(rows){
  const base=baseline();
  const yPrev=rows.filter(r=>(r['Created (UTC)']||'').startsWith(PREV_S));
  const yCur=rows.filter(r=>(r['Created (UTC)']||'').startsWith(CUR_S));
  const kPrev=kpis(yPrev), kCur=kpis(yCur);
  const nrf=rows.filter(r=>/^y/i.test(r['Non-Refundable'])).reduce((s,r)=>s+(Number(r.Nights)||0),0);
  const flex=rows.reduce((s,r)=>s+(Number(r.Nights)||0),0)-nrf;
  const ci=byYearMonth(rows,'Check-In');
  const bk=byYearMonth(rows,'Created (UTC)');
  $('#tab-body').innerHTML = `
    <div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="l">Room nights ${PREV_YEAR}</div><div class="v">${kPrev.rn.toLocaleString()}</div></div>
      <div class="kpi"><div class="l">Room nights ${CUR_YEAR} YTD</div><div class="v">${kCur.rn.toLocaleString()}</div></div>
      <div class="kpi"><div class="l">Bookings ${PREV_YEAR}</div><div class="v">${kPrev.bookings.toLocaleString()}</div></div>
      <div class="kpi"><div class="l">Bookings ${CUR_YEAR} YTD</div><div class="v">${kCur.bookings.toLocaleString()}</div></div>
      <div class="kpi"><div class="l">Cost ${PREV_YEAR}</div><div class="v">€${Math.round(kPrev.cost).toLocaleString()}</div></div>
      <div class="kpi"><div class="l">Cost ${CUR_YEAR} YTD</div><div class="v">€${Math.round(kCur.cost).toLocaleString()}</div></div>
    </div>
    <p style="color:var(--muted);font-size:12px">Room nights, cost and ADR include cancelled lines. NRF: ${nrf.toLocaleString()} RN · Flexible: ${flex.toLocaleString()} RN</p>
    <div class="grid2">
      <div><div style="font-weight:600;margin-bottom:4px">Room nights by check-in date</div><div class="chart-box"><canvas id="c-ci"></canvas></div></div>
      <div><div style="font-weight:600;margin-bottom:4px">Room nights by booking date</div><div class="chart-box"><canvas id="c-bk"></canvas></div></div>
    </div>
    <div style="font-weight:600;margin:8px 0 4px">${PREV_YEAR} vs ${CUR_YEAR} YTD</div>
    <div class="chart-box"><canvas id="c-cmp"></canvas></div>`;
  lineChart('c-ci', MN, ci.yPrev, ci.yCur, PREV_S);
  lineChart('c-bk', MN, bk.yPrev, bk.yCur, PREV_S);
  const bK = base ? kpis(base.rows) : kPrev;
  const bLabel = base ? base.label : PREV_S;
  new Chart($('#c-cmp'), {type:'bar', data:{labels:['Room nights','Bookings','Cost /100'], datasets:[
    {label:bLabel, data:[bK.rn, bK.bookings, bK.cost/100], backgroundColor:'#94a3b8'},

}

// Rebooking = bookings (unique Booking ID) of the same property, check-in, check-out, passengers and guest (Lead Name).
// Qualifies when the most recent booking is cheaper than the first, and every earlier booking is cancelled
// (the latest may be confirmed or cancelled). Uses the SUBJECT filters only (country / master city / city / property):
// status, contract and the compare term are ignored.
let _rebookCache={key:'',groups:null};
function normGuest(n){ return String(n||'').toLowerCase().replace(/[.,]/g,' ').replace(/\s+/g,' ').trim().replace(/^(mr|mrs|ms|miss|mx|dr|mstr)\s+/,''); }
function rebookGroups(){
  const f=S.filters, key=[f.country,f.master,f.city,f.prop,S.sales.length].join('|');
  if(_rebookCache.key===key) return _rebookCache.groups;
  const bookings=new Map();
  for(const r of S.sales){
    if((f.country&&r.Country!==f.country)||(f.master&&r['Master City']!==f.master)||(f.city&&r.City!==f.city)||(f.prop&&r.Property!==f.prop)) continue;
    const id=r['Booking ID']; let b=bookings.get(id);
    if(!b){ b={id, prop:r.Property||'', ci:String(r['Check-In']||'').slice(0,10), co:String(r['Check-Out']||'').slice(0,10), pax:String(r.Passengers||'').trim(), guest:r['Lead Name']||'', created:r['Created (UTC)']||'', client:(r['Client Name']||'').trim()||'(blank)', cost:0, rn:0, active:false, lines:0};
      bookings.set(id,b); }
    b.cost+=Number(r.Cost)||0; b.rn+=Number(r.Nights)||0; b.lines++;
    if(!isCancelled(r)) b.active=true;
    if((r['Created (UTC)']||'')<b.created) b.created=r['Created (UTC)'];
  }
  const clientTotals=new Map();
  for(const b of bookings.values()) clientTotals.set(b.client,(clientTotals.get(b.client)||0)+1);
  const groups=new Map();
  for(const b of bookings.values()){
    const g=normGuest(b.guest); if(!g||!b.ci||!b.co) continue;
    const k=[b.prop,b.ci,b.co,b.pax,g].join('|'); let arr=groups.get(k); if(!arr){arr=[];groups.set(k,arr);} arr.push(b);
  }
  const out=[];
  for(const arr of groups.values()){
    if(arr.length<2) continue;
    arr.sort((a,b)=>a.created<b.created?-1:a.created>b.created?1:(a.id<b.id?-1:1));
    const first=arr[0], last=arr[arr.length-1];
    if(arr.slice(0,-1).some(b=>b.active)) continue;
    if(!(last.cost<first.cost)) continue;
    out.push({first,last,all:arr,saving:first.cost-last.cost,pct:first.cost?(first.cost-last.cost)/first.cost*100:0});
  }
  out.sort((a,b)=>a.last.created<b.last.created?1:-1);
  out.clientTotals=clientTotals;
  _rebookCache={key,groups:out};

}

// ───────── Hand-off to Auto Audit ─────────
// Builds the files Auto Audit's "Files" flow expects, for ONE property (+ the compare subject as the "City" side),
// and stores them in IndexedDB; index.html picks them up on load and maps them into its 13 slots.
function idbPut(payload){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('IndexedDB not available in this browser'));
    const rq=indexedDB.open('g2-handoff',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
    rq.onerror=()=>rej(rq.error);
    rq.onsuccess=()=>{ const db=rq.result, tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(payload,'region');
      tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); };
  });
}
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function wbBlob(ws){ const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Sheet1'); return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:XLSX_MIME}); }
function rowsBlob(rows, numify){
  if(numify) rows=rows.map(r=>{ const o={}; for(const k in r){ const v=r[k]; o[k]=(!/id|code/i.test(k) && typeof v==='string' && /^-?\d+(\.\d+)?$/.test(v)) ? Number(v) : v; } return o; });
  return wbBlob(XLSX.utils.json_to_sheet(rows));
}
const LOS_KEYS=['1','2','3','4','5','6','7','8-10','11-14','15+'];

function losKey(n){ return n>=15?'15+':n>=11?'11-14':n>=8?'8-10':String(n); }
function bwKey(d){ return d>=251?'251+':d>=181?'181-250':d>=121?'121-180':d>=91?'91-120':d>=61?'61-90':d>=31?'31-60':d>=16?'16-30':d>=6?'6-15':d>=1?'1-5':'0'; }

// Demand profile estimated from sales rows: current-year creations, cancelled lines excluded.
// LOS / booking window / arrival day = share of booking lines; source markets = share of room nights.
function demandBlobs(rows, prefix){
  const cur=rows.filter(r=>(r['Created (UTC)']||'').startsWith(CUR_S) && !isCancelled(r));
  const los={}, bw={}, wd=Array(7).fill(0), sm={}; let nLos=0,nBw=0,nWd=0,rn=0;
  LOS_KEYS.forEach(k=>los[k]=0); BW_KEYS.forEach(k=>bw[k]=0);
  cur.forEach(r=>{
    const n=Number(r.Nights)||0;
    if(n>=1){ los[losKey(n)]++; nLos++; }
    let lead=Number(r['Lead Time']);
    if(r['Lead Time']===''||r['Lead Time']==null||isNaN(lead)){ const ci=isoDay(r['Check-In']), cr=isoDay(r['Created (UTC)']); lead=(isNaN(ci)||isNaN(cr))?NaN:Math.round((ci-cr)/864e5); }
    if(!isNaN(lead)&&lead>=0){ bw[bwKey(lead)]++; nBw++; }
    const ci=isoDay(r['Check-In']); if(!isNaN(ci)){ wd[(new Date(ci).getUTCDay()+6)%7]++; nWd++; }
    const m=(r['Source Market']||'').trim()||'Other'; sm[m]=(sm[m]||0)+n; rn+=n;
  });
  const simple=(title,keys,map,tot)=>wbBlob(XLSX.utils.aoa_to_sheet([[title,'% of bookings'],...keys.map(k=>[k,tot?map[k]/tot:0])]));
  const top=Object.entries(sm).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return [
    {name:prefix+'_Length_of_Stay.xlsx',        blob:simple('Length of Stay',LOS_KEYS,los,nLos)},
    {name:prefix+'_Booking_Window.xlsx',        blob:simple('Booking Window',BW_KEYS,bw,nBw)},
    {name:prefix+'_Top_10_Source_Markets.xlsx', blob:wbBlob(XLSX.utils.aoa_to_sheet([['','Source Market','% of Room Nights'],...top.map(([k,v])=>['',k,rn?v/rn:0])]))},
    {name:prefix+'_Arrival_Days_of_Week.xlsx',  blob:wbBlob(XLSX.utils.aoa_to_sheet([['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],[String(CUR_YEAR),...wd.map(v=>nWd?v/nWd:0)]]))}
  ];
}
function buildHandoff(){
  const prop=S.filters.prop;
  const byProp=r=>r.Property===prop;
  const sales=S.sales.filter(byProp);
  if(!sales.length) throw new Error('No sales rows for '+prop);
  const city=sales[0].City||'';
  const cmp=cmpRows() || S.sales.filter(r=>r.City===city);
  const cmpLabel=cmpRows()? S.cmp.val : city;
  const items=[];
  items.push({name:'Daily_Creations_Region.xlsx', blob:rowsBlob(sales,true)});
  const av=S.avail.filter(byProp); if(av.length) items.push({name:'Availability_Report_Region.xlsx', blob:rowsBlob(av,true)});
  const rp=S.plans.filter(byProp); if(!rp.length) throw new Error('No Rate Plan rows for '+prop+' in the Rate Plan report');
  items.push({name:'Rate_Plan_Report_Region.xlsx', blob:rowsBlob(rp,false)});
  const od=S.offers.filter(byProp); if(od.length) items.push({name:'Offer_Details_Region.xlsx', blob:rowsBlob(od,false)});
  demandBlobs(sales,'Hotel').forEach(i=>items.push(i));
  demandBlobs(cmp,'City').forEach(i=>items.push(i));
  return {created:Date.now(), property:prop, city, compare:cmpLabel, counts:{sales:sales.length,compare:cmp.length,avail:av.length,plans:rp.length,offers:od.length}, items};
}
// ───────── Keep the loaded data for the day (browser-only, IndexedDB) ─────────
const CACHE_DB='g2-region-cache', SEL_KEY='g2.region.sel';
function dayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function cacheOpen(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('IndexedDB not available'));
  const rq=indexedDB.open(CACHE_DB,1); rq.onupgradeneeded=()=>rq.result.createObjectStore('kv'); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function cacheSave(list){
  const db=await cacheOpen();
  try{ await new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put({day:dayKey(),saved:Date.now(),files:list.map(f=>({name:f.name,type:f.type,blob:f}))},'data');
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
  finally{ db.close(); }
}
async function cacheLoad(){
  const db=await cacheOpen();
  try{ const data=await new Promise((res,rej)=>{ const rq=db.transaction('kv','readonly').objectStore('kv').get('data'); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); });
    if(data && data.day!==dayKey()){ await cacheDelete(); return null; }
    return data; }
  finally{ db.close(); }
}
async function cacheDelete(){
  try{ const db=await cacheOpen(); await new Promise(res=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').delete('data'); tx.oncomplete=res; tx.onerror=res; tx.onabort=res; }); db.close(); }catch(e){}
}
async function clearSaved(){ await cacheDelete(); try{ localStorage.removeItem(SEL_KEY); }catch(e){} location.reload(); }
function noteMsg(html){ const el=document.querySelector('#msg .msg'); if(el) el.innerHTML+=' · '+html; }
function saveSel(){
  if(!S.sales.length || S.restoring) return;
  try{ localStorage.setItem(SEL_KEY, JSON.stringify({day:dayKey(), filters:S.filters, cmp:S.cmp, tab:S.tab, rebookMode:S.rebookMode||'all', rebookShow:S.rebookShow||{charts:false,clients:false}})); }catch(e){}
}
function readSel(){ try{ const v=JSON.parse(localStorage.getItem(SEL_KEY)||'null'); return v&&v.day===dayKey()?v:null; }catch(e){ return null; } }
function applySel(sel){
  if(!sel) return;
  const f=sel.filters||{};
  S.filters={country:'',master:'',city:'',prop:'',status:'',contract:''};
  const set=(id,key)=>{ const el=$('#'+id); if(f[key] && [...el.options].some(o=>o.value===f[key])){ el.value=f[key]; S.filters[key]=f[key]; } };
  set('f-country','country'); cascade(); set('f-master','master'); cascade(); set('f-city','city'); cascade(); set('f-prop','prop');
  set('f-status','status'); set('f-contract','contract');
  $('#btn-audit').disabled=!S.filters.prop;
  if(sel.cmp && sel.cmp.type){
    $('#cmp-type').value=sel.cmp.type; $('#cmp-type').onchange();
    const cv=$('#cmp-val'); if(sel.cmp.val && [...cv.options].some(o=>o.value===sel.cmp.val)){ cv.value=sel.cmp.val; S.cmp.val=sel.cmp.val; }
  }
  if(sel.tab && TABS.map(t=>t.toLowerCase()).includes(sel.tab)) S.tab=sel.tab;
  if(sel.rebookMode) S.rebookMode=sel.rebookMode;
  if(sel.rebookShow) S.rebookShow=sel.rebookShow;
}
{ const _render=render, _renderTabs=renderTabs;
  render=function(){ _render.apply(this,arguments); saveSel(); };
  renderTabs=function(){ _renderTabs.apply(this,arguments); saveSel(); }; }
async function restoreSaved(){
  let data=null; try{ data=await cacheLoad(); }catch(e){ return; }
  if(!data) return;
  msg('Loading the data you loaded earlier today…');
  const sel=readSel(); S.restoring=true;
  try{
    await handleFiles(data.files.map(f=>new File([f.blob],f.name,{type:f.type})), {fromCache:true});
    applySel(sel); S.restoring=false; render();
    const t=new Date(data.saved).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    noteMsg('<b>Restored from today '+t+'</b> · <a href="#" onclick="clearSaved();return false">Clear saved data</a> · or drop a new folder to replace it');
  }catch(e){ S.restoring=false; console.error(e); msg('Could not restore saved data ('+(e.message||e)+'). Please drop the folder again.','err'); }
}
restoreSaved();

// ───────────────────────── PPTX report (all tabs, current selection) ─────────────────────────
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('Could not load '+src)); document.head.appendChild(s); }); }
async function downloadReport(){
  const btn=$('#btn-report'); if(!S.sales.length || btn.disabled) return;
  const label=btn.textContent; btn.disabled=true;
  const keep={tab:S.tab, rb:S.rebookShow?{...S.rebookShow}:null, anim:Chart.defaults.animation, y:window.scrollY};
  const tick=m=>{ btn.textContent=m; return new Promise(r=>setTimeout(r,30)); };
  try{
    await tick('Preparing…');
    if(!window.PptxGenJS) await loadScript('./pptxgen.bundle.js');
    Chart.defaults.animation=false;
    const C={blue:'1A7DC4',dk:'0F5A91',lt:'E8F3FB',mid:'D0E8F5',ink:'1A1A2E',gray:'555566',lg:'F4F6FA',mg:'C0C8D8',white:'FFFFFF',red:'C0392B',green:'1A7A3C'};
    const pres=new PptxGenJS(); pres.layout='LAYOUT_WIDE'; // 13.33 x 7.5 in
    const sel=id=>{ const e=$(id); return e && e.value ? e.selectedOptions[0].textContent.trim() : ''; };
    const scopeParts=[sel('#f-prop'),sel('#f-city'),sel('#f-master'),sel('#f-country')].filter(Boolean);
    const scope=scopeParts[0]||'All properties';
    const fl=[['Country',sel('#f-country')],['Master city',sel('#f-master')],['City',sel('#f-city')],['Property',sel('#f-prop')],['Status',sel('#f-status')],['Contract',sel('#f-contract')]].filter(x=>x[1]).map(x=>x[0]+': '+x[1]);
    const cmpTxt=S.cmp&&S.cmp.type&&S.cmp.val ? 'Compared with '+S.cmp.val : 'Compared with previous year';
    const today=new Date(); const dstr=today.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    pres.title='Overview '+scope;
    const chrome=(sl,n,sec)=>{
      sl.addShape(pres.shapes.RECTANGLE,{x:0.35,y:0.18,w:0.32,h:0.32,fill:{color:C.blue},line:{type:'none'}});
      sl.addText(String(n),{x:0.35,y:0.18,w:0.32,h:0.32,fontSize:10,bold:true,color:C.white,align:'center',valign:'middle',fontFace:'Calibri',margin:0});
      sl.addText(sec,{x:0.77,y:0.18,w:8,h:0.32,fontSize:11,color:C.blue,fontFace:'Calibri',valign:'middle',margin:0});
      sl.addText(scope+' · '+dstr,{x:7.5,y:0.18,w:5.5,h:0.32,fontSize:9,color:C.gray,fontFace:'Calibri',align:'right',valign:'middle',margin:0});
    };
    const title=(sl,t,sub)=>{ sl.addText(t,{x:0.35,y:0.58,w:12.6,h:0.5,fontSize:22,bold:true,color:C.ink,fontFace:'Calibri',margin:0}); if(sub) sl.addText(sub,{x:0.35,y:1.08,w:12.6,h:0.26,fontSize:10,color:C.gray,fontFace:'Calibri',margin:0}); };
    const kpiCards=(sl,list,y,perRow)=>{
      const n=Math.min(list.length,perRow), gap=0.12, w=(12.63-gap*(n-1))/n, h=0.95;
      list.slice(0,perRow*2).forEach((k,i)=>{
        const x=0.35+(i%perRow)*(w+gap), yy=y+Math.floor(i/perRow)*(h+0.1);
        sl.addShape(pres.shapes.RECTANGLE,{x,y:yy,w,h,fill:{color:C.lt},line:{color:C.mid,width:1}});
        sl.addShape(pres.shapes.RECTANGLE,{x,y:yy,w,h:0.05,fill:{color:C.blue},line:{type:'none'}});
        sl.addText(k.l,{x:x+0.1,y:yy+0.09,w:w-0.2,h:0.24,fontSize:9,color:C.gray,fontFace:'Calibri',margin:0});
        sl.addText(k.v,{x:x+0.1,y:yy+0.33,w:w-0.2,h:0.36,fontSize:k.v.length>9?15:18,bold:true,color:C.dk,fontFace:'Calibri',margin:0});
        if(k.d) sl.addText(k.d,{x:x+0.1,y:yy+0.68,w:w-0.2,h:0.2,fontSize:9,bold:true,color:/^-|−/.test(k.d)?C.red:C.green,fontFace:'Calibri',margin:0});
      });
      return y+(Math.ceil(Math.min(list.length,perRow*2)/perRow))*(h+0.1);
    };
    const readKpis=root=>[...root.querySelectorAll('.kpi')].filter(e=>e.offsetParent).map(e=>({l:(e.querySelector('.l')||{}).textContent||'',v:(e.querySelector('.v')||{}).textContent||'',d:((e.querySelector('.d')||{}).textContent||'').trim()}));
    const flat=s=>String(s).replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ').trim();
    // heading text for a chart or table
    const headFor=(el,fallback)=>{
      let n=el.closest('.chart-box')||el.closest('div[style*="overflow-x"]')||el;
      for(let hops=0;n && n.id!=='tab-body' && hops<5;hops++){
        const p=n.previousElementSibling;
        if(p && !p.querySelector('canvas,table') && p.textContent.trim() && p.textContent.length<200){ const c=p.cloneNode(true); c.querySelectorAll('button').forEach(b=>b.remove()); const t=flat(c.textContent); if(t) return t.replace(/\s*\(.*$/,'').slice(0,90); }
        n=n.parentElement;
      }
      return fallback;
    };
    let secNo=0;
    // cover
    { const sl=pres.addSlide();
      sl.addShape(pres.shapes.RECTANGLE,{x:0,y:0,w:13.33,h:2.9,fill:{color:C.blue},line:{type:'none'}});
      sl.addText('Overview report',{x:0.6,y:0.55,w:12,h:0.6,fontSize:34,bold:true,color:C.white,fontFace:'Calibri',margin:0});
      sl.addText(scope,{x:0.6,y:1.3,w:12,h:0.5,fontSize:20,color:'CADCFC',fontFace:'Calibri',margin:0});
      sl.addText([cmpTxt,'G2 Travel · '+dstr].join('   ·   '),{x:0.6,y:2.1,w:12,h:0.4,fontSize:12,color:'CADCFC',fontFace:'Calibri',margin:0});
      const yy=kpiCards(sl,readKpis($('#kpis')),3.3,4);
      sl.addText('Selection',{x:0.6,y:yy+0.1,w:4,h:0.3,fontSize:12,bold:true,color:C.dk,fontFace:'Calibri',margin:0});
      sl.addText(fl.length?fl.join('   ·   '):'All data (no filters)',{x:0.6,y:yy+0.42,w:12,h:0.35,fontSize:11,color:C.gray,fontFace:'Calibri',margin:0});
      sl.addText('Year-to-date figures compare '+CUR_YEAR+' with the comparison base. Cancelled = any status other than Confirmed.',{x:0.6,y:yy+0.8,w:12,h:0.3,fontSize:9,color:C.gray,fontFace:'Calibri',margin:0});
    }
    const NOTES={rebook:'Rebooking = same property, check-in, check-out, passengers and guest name; earlier bookings cancelled and the latest cheaper than the first. Ignores status/contract filters and the comparison.'};
    const imgOf=cv=>{ const o=document.createElement('canvas'); o.width=cv.width; o.height=cv.height; const g=o.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,o.width,o.height); g.drawImage(cv,0,0); return {data:o.toDataURL('image/png'),w:o.width,h:o.height}; };
    const MAXROWS=16, MAXTBL=2; // rows per slide / slides per table
    const rowsNow=filtered(S.sales);
    for(let ti=0;ti<TABS.length;ti++){
      const tName=TABS[ti], tKey=tName.toLowerCase();
      await tick('Tab '+(ti+1)+' of '+TABS.length+'…');
      S.tab=tKey; if(tKey==='rebook') S.rebookShow={charts:true,clients:true};
      renderTabs(rowsNow);
      await new Promise(r=>setTimeout(r,80));
      const body=$('#tab-body'); secNo++;
      const kp=readKpis(body);
      const charts=[...body.querySelectorAll('canvas')].filter(c=>c.offsetParent && c.width>0).map(c=>({t:headFor(c,tName),img:imgOf(c)}));
      const tables=[...body.querySelectorAll('table')].filter(t=>t.offsetParent).map(t=>{
        const trs=[...t.rows]; if(trs.length<2) return null;
        const data=trs.map(r=>[...r.cells].map(c=>flat(c.innerText)));
        return {t:headFor(t,tName),head:data[0],rows:data.slice(1),mono:t.rows[0].cells.length};
      }).filter(Boolean);
      // slide 1: KPIs + first charts
      let first=true;
      const newSlide=(sub)=>{ const sl=pres.addSlide(); chrome(sl,secNo,tName); title(sl,tName,sub||NOTES[tKey]||''); return sl; };
      let sl=null, y0=1.5;
      if(kp.length){ sl=newSlide(); y0=kpiCards(sl,kp,1.5,Math.min(kp.length,6))+0.05; }
      // charts: up to 4 per slide (2x2)
      for(let i=0;i<charts.length;i+=4){
        if(!sl) { sl=newSlide(); y0=1.5; }
        const grp=charts.slice(i,i+4), per=2, gx=0.2, gy=0.15, bw=(12.63-gx)/2;
        const rowsN=Math.ceil(grp.length/per), avail=7.25-y0, bh=Math.min(3.1,(avail-gy*(rowsN-1))/rowsN);
        grp.forEach((c,k)=>{
          const x=0.35+(k%per)*(bw+gx), y=y0+Math.floor(k/per)*(bh+gy);
          sl.addShape(pres.shapes.RECTANGLE,{x,y,w:bw,h:bh,fill:{color:C.white},line:{color:C.mg,width:0.5}});
          sl.addText(c.t,{x:x+0.1,y:y+0.04,w:bw-0.2,h:0.26,fontSize:10,bold:true,color:C.ink,fontFace:'Calibri',margin:0});
          const iw=bw-0.2, ih=bh-0.38, ar=c.img.w/c.img.h; let w=iw,h=w/ar; if(h>ih){h=ih;w=h*ar;}
          sl.addImage({data:c.img.data,x:x+0.1+(iw-w)/2,y:y+0.32+(ih-h)/2,w,h});
        });
        sl=null;
      }
      // tables
      for(const tb of tables){
        const nCols=tb.head.length, total=tb.rows.length;
        const wts=tb.head.map((h,c)=>Math.max(4,Math.min(26,Math.max(h.length,...tb.rows.slice(0,40).map(r=>(r[c]||'').length)))));
        const sum=wts.reduce((a,b)=>a+b,0), colW=wts.map(w=>12.63*w/sum);
        const fs=nCols>11?8:nCols>8?9:10;
        const pages=Math.min(MAXTBL,Math.ceil(total/MAXROWS))||1;
        for(let p=0;p<pages;p++){
          const part=tb.rows.slice(p*MAXROWS,(p+1)*MAXROWS); if(!part.length && p>0) break;
          const s2=pres.addSlide(); chrome(s2,secNo,tName); title(s2,tb.t, total>pages*MAXROWS?'Showing '+Math.min(total,pages*MAXROWS)+' of '+total.toLocaleString()+' rows':(total.toLocaleString()+' rows'));
          const hdr=tb.head.map(h=>({text:h,options:{bold:true,color:C.white,fill:{color:C.blue},fontSize:fs,fontFace:'Calibri',valign:'middle'}}));
          const body2=part.map((r,ri)=>r.map(v=>({text:v,options:{fontSize:fs,color:C.ink,fontFace:'Calibri',fill:{color:ri%2?C.lg:C.white},valign:'middle'}})));
          s2.addTable([hdr,...body2],{x:0.35,y:1.5,w:12.63,colW,border:{type:'solid',pt:0.5,color:C.mg},margin:[0.03,0.05,0.03,0.05],autoPage:false});
        }
      }
      if(!kp.length && !charts.length && !tables.length){ const s3=newSlide(); s3.addText('No data for this selection.',{x:0.6,y:2.2,w:10,h:0.5,fontSize:14,color:C.gray,fontFace:'Calibri'}); }
    }
    await tick('Saving…');
    const stamp=today.toISOString().slice(0,10);
    const safe=scope.replace(/[^\w\-]+/g,'_').slice(0,40);
    await pres.writeFile({fileName:'Overview_'+safe+'_'+stamp+'.pptx'});
  }catch(e){ console.error(e); alert('Could not build the report: '+(e.message||e)); }
  finally{
    Chart.defaults.animation=keep.anim; S.tab=keep.tab; S.rebookShow=keep.rb||S.rebookShow;
    if(keep.rb===null) delete S.rebookShow;
    render(); window.scrollTo(0,keep.y);
    btn.textContent=label; btn.disabled=false;
  }
}
$('#btn-report').onclick=downloadReport;
</script>
