<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · G2 Travel</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a2e}
.card{width:min(380px,calc(100% - 32px));background:#fff;border:1px solid #C0C8D8;border-radius:12px;padding:28px}
h1{margin:0 0 6px;font-size:1.3rem}
p{margin:0 0 18px;color:#6b7a99;font-size:.95rem}
label{display:block;font-size:.82rem;font-weight:600;color:#6b7a99;margin-bottom:6px}
input{width:100%;box-sizing:border-box;border:1px solid #C0C8D8;border-radius:8px;padding:10px 12px;font:inherit}
button{margin-top:14px;width:100%;border:0;background:#1A7DC4;color:#fff;border-radius:8px;padding:10px 12px;font:inherit;font-weight:650;cursor:pointer}
.err{margin-top:12px;color:#C0392B;font-size:.9rem}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>G2 Travel</h1>
  <p>Shared password for the contract tools.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('pw').value })
  });
  if (!res.ok) { err.textContent = 'Wrong password.'; return; }
  const next = new URLSearchParams(location.search).get('next') || '/';
  location.href = next.startsWith('/') ? next : '/';
};
</script>
</body>
</html>
