<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Period Compare · G2 Travel</title>
<style>
:root{--blue:#1A7DC4;--dkblue:#0F5A91;--bg:#f0f2f5;--surface:#ffffff;--border:#C0C8D8;--text:#1a1a2e;--muted:#6b7a99;--ink:#1a1a2e;--mute:#6b7a99;--line:#C0C8D8;--card:#fff;--paper:#f0f2f5;--teal:#1A7DC4}
[data-theme="dark"]{--blue:#4AA3E0;--dkblue:#2a82c4;--bg:#0f1117;--surface:#1a1d27;--border:#2e3347;--text:#e8ecf5;--muted:#7a85a3;--ink:#e8ecf5;--mute:#7a85a3;--line:#2e3347;--card:#1a1d27;--paper:#0f1117;--teal:#4AA3E0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.45;min-height:100vh}
.header{background:var(--blue);padding:.75rem 2rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--dkblue)}
.logo-mark{font-size:11px;font-weight:700;color:#fff;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 11px;border-radius:5px}
.header-title{font-size:15px;font-weight:600;color:#fff}
.header-sub{font-size:11px;color:rgba(255,255,255,.6)}
.app-nav{display:flex;align-items:center;gap:4px;margin-left:14px;flex-wrap:wrap;flex:1}
.app-nav-link{color:rgba(255,255,255,.75);text-decoration:none;font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid transparent;white-space:nowrap;background:none}
.app-nav-link:hover{background:rgba(255,255,255,.12);color:#fff}
.app-nav-link.is-active{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.2)}
.header-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);font-size:11px;padding:3px 9px;border-radius:20px;margin-left:auto;font-family:monospace}
.dark-toggle{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;margin-left:8px}
.dark-toggle:hover{background:rgba(255,255,255,.12);color:#fff}
main{max-width:1280px;margin:0 auto;padding:28px}
h2{font-size:1.6rem;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--card)}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--mute);font-size:.85rem}
.err{color:#b42318;font-weight:600}
.ok{color:#067647}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:6px 8px;border-bottom:1px solid #edf3f2;text-align:left}
th{background:#fafcfc;font-weight:600;color:var(--mute)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi div{background:#f7faf9;border-radius:8px;padding:12px}
.kpi b{display:block;font-size:1.3rem}
progress{width:100%;height:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="header">
  <div class="logo-mark">G2</div>
  <div><div class="header-title">G2 Travel</div><div class="header-sub">Contract & Availability Tools</div></div>
  <nav class="app-nav" aria-label="Tools">
    <a class="app-nav-link" href="./index.html#files">Auto Audit (Files)</a>
    <a class="app-nav-link" href="./index.html#excel">Auto Audit (Excel)</a>
    <a class="app-nav-link" href="./index.html#price">Price Check</a>
    <a class="app-nav-link" href="./index.html#search">Hotel Search</a>
    <a class="app-nav-link" href="./topup.html">Top-up Desk</a>
    <a class="app-nav-link" href="./rates.html">Live Rates</a>
    <a class="app-nav-link" href="./uuid.html">Property UUID</a>
    <a class="app-nav-link" href="./prebuy.html">Pre-buy Price Check</a>
    <a class="app-nav-link is-active" href="./period.html">Period Compare</a>
  </nav>
  <div class="header-badge">v4.4</div>
  <button class="dark-toggle" id="dark-toggle" title="Toggle dark mode">🌙 Dark</button>
</header>
