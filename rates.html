<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Rates · G2 Travel</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--paper:#f0f2f5;--card:#fff;--ink:#1a1a2e;--mute:#6b7a99;--line:#C0C8D8;--teal:#1A7DC4;--teal-d:#0F5A91;--wash:#E8F3FB;--amber:#B7600A;--amber-w:#FEF5EA;--bad:#C0392B;--bad-w:#FDF0EF;--ok:#1e7a4a;--ok-w:#e8f6ee}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.header{background:#1A7DC4;padding:.75rem 2rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:3px solid #0F5A91;flex-wrap:wrap}
.logo-mark{font-size:11px;font-weight:700;color:#fff;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 11px;border-radius:5px}
.header-title{font-size:15px;font-weight:600;color:#fff}
.header-sub{font-size:11px;color:rgba(255,255,255,.6)}
.header-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);font-size:11px;padding:3px 9px;border-radius:20px;margin-left:auto;font-family:monospace}
.dark-toggle{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer}
.app-nav{display:flex;align-items:center;gap:4px;margin-left:14px;flex-wrap:wrap;flex:1}
.app-nav-link{color:rgba(255,255,255,.75);text-decoration:none;font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.app-nav-link:hover{background:rgba(255,255,255,.12);color:#fff}
.app-nav-link.is-active{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.2)}
@media(max-width:1100px){.app-nav-link{font-size:11px;padding:5px 9px}}
body.dark{--paper:#0f1117;--card:#1a1d27;--ink:#e8ecf5;--mute:#7a85a3;--line:#2e3347;--wash:#0d1e2e}
main{max-width:1180px;margin:0 auto;padding:28px 28px 80px}
h2{font-size:1.55rem;font-weight:650;letter-spacing:-.015em;margin-bottom:6px}
.lead{color:var(--mute);max-width:76ch;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field label{display:block;font-weight:600;font-size:.82rem;color:var(--mute);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--card)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:.87rem}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.hint{color:var(--mute);font-size:.87rem}
.msg{padding:9px 12px;border-radius:7px;font-size:.93rem;margin-top:10px}
.msg.warn{background:var(--amber-w);color:var(--amber)}
.msg.err{background:var(--bad-w);color:var(--bad)}
.msg.ok{background:var(--ok-w);color:var(--ok)}
.hits{display:grid;gap:6px;margin-top:12px}
.hit{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{color:var(--mute);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase}
td.num,th.num{text-align:right}
.tag{display:inline-block;border-radius:20px;padding:2px 8px;font-size:.75rem;font-weight:700}
.tag.ok{background:var(--ok-w);color:var(--ok)}
.tag.bad{background:var(--bad-w);color:var(--bad)}
</style>
</head>
<body>
<header class="header">
  <div class="logo-mark">G2</div>
  <div><div class="header-title">G2 Travel</div><div class="header-sub">Contract & Availability Tools</div></div>
  <nav class="app-nav" aria-label="Tools">
    <a class="app-nav-link" href="./#files">Auto Audit (Files)</a>
    <a class="app-nav-link" href="./#excel">Auto Audit (Excel)</a>
    <a class="app-nav-link" href="./#price">Price Check</a>
    <a class="app-nav-link" href="./#search">Hotel Search</a>
    <a class="app-nav-link" href="./topup.html">Top-up Desk</a>
    <a class="app-nav-link" href="./prebuy.html">Pre-buy Price Check</a>
    <a class="app-nav-link" href="./rates.html">Live Rates</a>
    <a class="app-nav-link" href="./uuid.html">Property UUID</a>
  </nav>
  <div class="header-badge">Rates</div>
  <button class="dark-toggle" id="dark-toggle" title="Toggle dark mode">🌙 Dark</button>
</header>
<main id="app"></main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const today = new Date();
const iso = d => d.toISOString().slice(0,10);
const plus = n => iso(new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()+n)));
const S = {q:'', country:'NL', city:'', checkin:plus(21), checkout:plus(22), currency:'EUR', nat:'IT', adults:2, board:'', hotel:null, hits:[], more:false, rates:[], nights:1, msg:'', msgk:'', busy:false};

function money(n, c){ if(n==null || n==='') return '—'; return Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+c; }

async function api(body){
  const res = await fetch('/api/liteapi-rates', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const json = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(json.error || ('Request failed '+res.status));
  return json;
}

function read(){
  S.q = $('#q').value.trim();
  S.country = $('#cc').value.trim().toUpperCase();
  S.city = $('#city').value.trim();
  S.checkin = $('#in').value;
  S.checkout = $('#out').value;
  S.currency = $('#cur').value;
  S.nat = $('#nat').value.trim().toUpperCase();
  S.adults = Number($('#ad').value)||2;
  S.board = $('#board').value;
}

async function findHotels(more){
  read();
  if(S.country.length!==2){ S.msg='Enter a 2-letter country code.'; S.msgk='err'; return render(); }
  if(!S.city && !S.q){ S.msg='Enter a city or part of a hotel name.'; S.msgk='err'; return render(); }
  const offset = more ? S.hits.length : 0;
  S.busy=true; S.msg = more ? 'Loading more hotels…' : 'Searching hotels…'; S.msgk=''; render();
  try{
    const j = await api({mode:'hotels', countryCode:S.country, cityName:S.city, hotelName:S.q, offset});
    const rows = j.hotels||[];
    S.hits = more ? S.hits.concat(rows) : rows;
    S.more = !!j.more;
    const where = j.widened ? ' in the country, not only that city' : '';
    S.msg = S.hits.length ? (S.hits.length+' hotels'+where+'. Pick one.'+(S.more?' More are available.':'')) : 'No hotels found. Try a shorter name, or clear the city.';
    S.msgk = S.hits.length ? 'ok' : 'warn';
  }catch(e){ S.msg=e.message; S.msgk='err'; }
  S.busy=false; render();
}

async function loadRates(){
  read();
  if(!S.hotel){ S.msg='Pick a hotel first.'; S.msgk='err'; return render(); }
  if(!S.checkin || !S.checkout || S.checkout<=S.checkin){ S.msg='Check-out must be after check-in.'; S.msgk='err'; return render(); }
  S.busy=true; S.msg='Loading live rates…'; S.msgk=''; render();
  try{
    const j = await api({mode:'rates', hotelId:S.hotel.id, checkin:S.checkin, checkout:S.checkout, currency:S.currency, guestNationality:S.nat, adults:S.adults});
    S.rates = j.rates||[];
    S.nights = j.nights||1;
    S.msg = S.rates.length ? S.rates.length+' rates.' : 'No availability for those dates.';
    S.msgk = S.rates.length ? 'ok' : 'warn';
  }catch(e){ S.msg=e.message; S.msgk='err'; S.rates=[]; }
  S.busy=false; render();
}

function shown(){
  if(!S.board) return S.rates;
  return S.rates.filter(r => r.board===S.board);
}

function render(){
  const rows = shown();
  $('#app').innerHTML = `
  <section>
    <h2>Live Rates</h2>
    <div class="card">
      <div class="grid">
        <div class="field"><label>Country</label><input id="cc" value="${esc(S.country)}" maxlength="2"></div>
        <div class="field"><label>City</label><input id="city" value="${esc(S.city)}" placeholder="Amsterdam"></div>
        <div class="field"><label>Hotel name</label><input id="q" value="${esc(S.q)}" placeholder="part of the name"></div>
        <div class="field"><label>Check-in</label><input id="in" type="date" value="${esc(S.checkin)}"></div>
        <div class="field"><label>Check-out</label><input id="out" type="date" value="${esc(S.checkout)}"></div>
        <div class="field"><label>Currency</label><select id="cur">${['EUR','GBP','USD','CHF'].map(c=>`<option ${c===S.currency?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Guest nationality</label><input id="nat" value="${esc(S.nat)}" maxlength="2"></div>
        <div class="field"><label>Adults</label><input id="ad" type="number" min="1" max="6" value="${S.adults}"></div>
        <div class="field"><label>Board</label><select id="board">
          <option value="" ${S.board===''?'selected':''}>All</option>
          <option value="RO" ${S.board==='RO'?'selected':''}>RO</option>
          <option value="BB" ${S.board==='BB'?'selected':''}>BB</option>
          <option value="HB" ${S.board==='HB'?'selected':''}>HB</option>
          <option value="FB" ${S.board==='FB'?'selected':''}>FB</option>
          <option value="AI" ${S.board==='AI'?'selected':''}>AI</option>
        </select></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="find" ${S.busy?'disabled':''}>Find hotel</button>
        <button class="btn pri" id="rates" ${S.busy||!S.hotel?'disabled':''}>Load rates</button>
        <span class="hint">${S.hotel?esc(S.hotel.name)+' · '+esc(S.hotel.id):'No hotel selected'}</span>
      </div>
      ${S.msg?`<div class="msg ${S.msgk}">${esc(S.msg)}</div>`:''}
      ${S.hits.length?`<div class="hits">${S.hits.map((h,i)=>`<div class="hit"><div><b>${esc(h.name)}</b><div class="hint">${esc([h.address,h.city,h.country].filter(Boolean).join(', '))}</div></div><button class="btn sm" data-use="${i}">Use</button></div>`).join('')}</div>`:''}
      ${S.more?`<div class="row" style="margin-top:10px"><button class="btn sm" id="more">Load more hotels</button></div>`:''}
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:14px 16px 8px"><h3>Rates</h3><p class="hint">${S.nights} night${S.nights===1?'':'s'} · cheapest first · taxes shown only when they are extra</p></div>
      <div class="scroll"><table><thead><tr>
        <th>Room</th><th>Board</th><th>Rate type</th><th>Cancellation</th><th class="num">Stay total</th><th>Extra taxes</th>
      </tr></thead><tbody>${rows.length?rows.map(r=>`<tr>
        <td>${esc(r.room)}</td>
        <td>${esc(r.board||'—')} ${r.boardName?`<span class="hint">${esc(r.boardName)}</span>`:''}</td>
        <td>${esc(r.rateType||'—')}</td>
        <td>${r.refundable?'<span class="tag ok">Flexible</span>':'<span class="tag bad">Non-refundable</span>'}</td>
        <td class="num"><b>${money(r.total, r.currency)}</b></td>
        <td class="hint">${r.taxes&&r.taxes.length?r.taxes.map(t=>esc((t.description||'Tax')+' '+money(t.amount,t.currency||r.currency))).join(' · '):'Included or not listed'}</td>
      </tr>`).join(''):`<tr><td colspan="6" class="hint">No rates yet.</td></tr>`}</tbody></table></div>
    </div>
  </section>`;
  $('#find').onclick=()=>findHotels(false);
  const moreBtn=document.getElementById('more'); if(moreBtn) moreBtn.onclick=()=>findHotels(true);
  $('#rates').onclick=loadRates;
  $('#board').onchange=()=>{ S.board=$('#board').value; render(); };
  document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{ S.hotel=S.hits[+b.dataset.use]; S.hits=[]; S.msg='Hotel set. Load rates when the dates are right.'; S.msgk='ok'; render(); });
}
(function(){
  const key='g2.theme';
  const apply=v=>{ document.body.classList.toggle('dark', v==='dark'); const b=document.getElementById('dark-toggle'); if(b) b.textContent=v==='dark'?'☀️ Light':'🌙 Dark'; };
  apply(localStorage.getItem(key)||'light');
  document.addEventListener('click',e=>{ if(e.target&&e.target.id==='dark-toggle'){ const next=document.body.classList.contains('dark')?'light':'dark'; localStorage.setItem(key,next); apply(next); } });
})();
render();
</script>
</body>
</html>
