name: Apply header nav
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and run patch
        run: |
          curl -fsSL -o patch_nav.py https://litter.catbox.moe/18avch.py
          python3 patch_nav.py
          python3 -c "import pathlib; t=pathlib.Path('index.html').read_text(encoding='utf-8',errors='replace'); assert 'Auto Audit (Files)' in t; assert 'goAppNav' in t"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html topup.html patch_nav.py
          git diff --cached --quiet || git commit -m "Put Auto Audit features in the header nav"
          git push
