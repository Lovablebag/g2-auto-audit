name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sales and Demand charts
        run: |
          curl -fsSL -o region.json "https://tmpfiles.org/dl/1793950444.c241b7025965265c/wLAiJkDUnaJH/region.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('region.json').read_text())['html']
          if 'd-cmp' not in page: raise SystemExit('missing')
          Path('region.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region.html
          git diff --cached --quiet || git commit -m "Region: Sales shows 2025 vs 2026, Demand has comparison charts"
          git push
