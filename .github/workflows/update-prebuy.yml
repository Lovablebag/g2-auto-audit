name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop Top-up preview overlap
        run: python3 patch_topup_overlap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topup.html
          git diff --cached --quiet || git commit -m "Keep Top-up preview beside the editor"
          git push
