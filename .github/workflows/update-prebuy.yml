name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore nights field
        run: |
          curl -fsSL -o rates.json "https://tmpfiles.org/dl/1793365877.8ea929eea7f2a4b5/wiAJHpEs5aV0/rates.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('rates.json').read_text())['html']
          if 'Nights' not in page or 'addDays' not in page or 'Cancellation' not in page: raise SystemExit('missing')
          Path('rates.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html
          git diff --cached --quiet || git commit -m "Live Rates: nights field with filters"
          git push
