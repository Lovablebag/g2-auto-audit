name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final rebuild
        run: |
          curl -fsSL -o region.json "https://tmpfiles.org/dl/1793951864.e73a25870ba5972b/wlA4JCDt1xgn/region.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('region.json').read_text())['html']
          if 'auditView' not in page or 'd-cmp' not in page: raise SystemExit('missing')
          Path('region.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region.html
          git diff --cached --quiet || git commit -m "Region: final rebuild with Audit tab and charts"
          git push
