name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix B2B search and add download
        run: |
          curl -fsSL -o prebuy-page.json "https://tmpfiles.org/dl/1792145662.c9c2e1263fc7f833/wUAaZOrfdyAs/prebuy-page.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('prebuy-page.json').read_text(encoding='utf-8'))['html']
          if 'downloadSheet' not in page or 'nameTries' not in page:
              raise SystemExit('page missing')
          Path('prebuy.html').write_text(page, encoding='utf-8')
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuy.html
          git diff --cached --quiet || git commit -m "Fix B2B hotel search and add download"
          git push
