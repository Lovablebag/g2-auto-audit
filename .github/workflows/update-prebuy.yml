name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore matching header
        run: |
          curl -fsSL -o period.json "https://tmpfiles.org/dl/1793175744.af3a121d8674039f/wRAKLpFZ36di/period.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('period.json').read_text())['content']
          if 'header-badge' not in page or 'v4.4' not in page: raise SystemExit('missing')
          Path('period.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add period.html
          git diff --cached --quiet || git commit -m "Restore Period Compare header to match the app"
          git push
