name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write full period page
        run: |
          curl -fsSL -o period.json "https://tmpfiles.org/dl/1793175844.4a1c58d0d923e96b/wpAfLBFBu0gN/period_full.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('period.json').read_text())['content']
          if 'header-badge' not in page or 'Generate preview' not in page or 'analyze' not in page:
              raise SystemExit('incomplete page')
          Path('period.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add period.html
          git diff --cached --quiet || git commit -m "Restore full Period Compare page with matching header"
          git push
