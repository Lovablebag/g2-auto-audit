name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact upload
        run: |
          curl -fsSL -o region.json "https://tmpfiles.org/dl/1793869897.430efc67bff0a949/wmAdJSHrzfB4/region.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('region.json').read_text())['html']
          if 'Nothing is stored' in page: raise SystemExit('text still there')
          Path('region.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region.html
          git diff --cached --quiet || git commit -m "Region: compact upload zone, remove nothing is stored"
          git push
