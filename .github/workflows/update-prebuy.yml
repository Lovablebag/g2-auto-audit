name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Live Rates columns
        run: python3 patch_rates_cols.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html api/liteapi-rates.js
          git diff --cached --quiet || git commit -m "Show rate type and supplier, drop per night"
          git push
