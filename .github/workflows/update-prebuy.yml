name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace prebuy.html
        run: |
          curl -fsSL -o prebuy.html https://litter.catbox.moe/9tiyl0.txt
          python3 -c "t=open('prebuy.html',encoding='utf-8').read(); assert 'data-date' in t and 'fetchOne' in t; print(len(t))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuy.html
          git diff --cached --quiet || git commit -m "Pre-buy: editable dates, add/remove nights, totals on ready rows"
          git push
