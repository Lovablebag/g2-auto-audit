name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Live Rates notices
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path('rates.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('<p class="lead">Production rates for one hotel and stay. This screen only looks up price, board and cancellation. It cannot book or prebook.</p>\n    ', '')
          t = t.replace("S.rates.length+' rates. Lookup only \u2014 nothing is booked.'", "S.rates.length+' rates.'")
          if 'nothing is booked' in t or 'Production rates for one hotel' in t:
              raise SystemExit('copy still present')
          p.write_text(t, encoding='utf-8')
          print('patched', len(t))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html
          git diff --cached --quiet || git commit -m "Remove Live Rates lookup notices"
          git push
