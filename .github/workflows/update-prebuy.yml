name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Period Compare
        run: |
          curl -fsSL -o period.json "https://tmpfiles.org/dl/1793032819.10cd7410a1107e36/wXACVTq8vl3A/period.html.json"
          curl -fsSL -o worker.json "https://tmpfiles.org/dl/1793032820.917c7bc4fc420528/wJACVrqgvhYL/worker.js.json"
          python3 - << 'PY'
          import json, re
          from pathlib import Path
          page = json.loads(Path('period.json').read_text())['content']
          worker = json.loads(Path('worker.json').read_text())['content']
          if 'Period Compare' not in page or 'Papa.parse' not in worker:
              raise SystemExit('files missing')
          Path('period.html').write_text(page)
          Path('period-worker.js').write_text(worker)
          nav = '<a class="app-nav-link" href="./period.html">Period Compare</a>'
          for f in ['index.html','topup.html','rates.html','uuid.html','prebuy.html']:
              p = Path(f)
              if not p.exists(): continue
              t = p.read_text()
              if 'period.html' in t: continue
              t = re.sub(r'(<a class="app-nav-link[^"]*" href="\./prebuy\.html">Pre-buy Price Check</a>)', r'\1\n    '+nav, t)
              p.write_text(t)
              print('patched', f)
          print('wrote period', len(page), 'worker', len(worker))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add period.html period-worker.js index.html topup.html rates.html uuid.html prebuy.html
          git diff --cached --quiet || git commit -m "Add Period Compare tool"
          git push
