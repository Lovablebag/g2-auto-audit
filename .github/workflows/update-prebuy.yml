name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Live Rates page and nav link
        run: |
          curl -fsSL -o rates.html https://litter.catbox.moe/qthasl.html
          python3 - << 'PY'
          from pathlib import Path
          t = Path('rates.html').read_text(encoding='utf-8')
          if 'Load rates' not in t:
              raise SystemExit('rates page missing expected copy')
          link = '<a class="app-nav-link" href="./rates.html">Live Rates</a>'
          for name in ('index.html','prebuy.html','topup.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if 'href="./rates.html"' in s:
                  print(name, 'already linked')
                  continue
              old = '<a class="app-nav-link" href="./prebuy.html"'
              if old not in s:
                  print(name, 'nav anchor missing')
                  continue
              s = s.replace(old, link + '\n    ' + old, 1)
              p.write_text(s, encoding='utf-8')
              print(name, 'linked')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html index.html prebuy.html topup.html
          git diff --cached --quiet || git commit -m "Add Live Rates lookup with no booking action"
          git push
