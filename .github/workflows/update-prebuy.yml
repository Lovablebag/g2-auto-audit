name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen Price Check nights column
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          css = '.pc-table-wrap{overflow-x:auto;margin-top:4px}'
          add = css + '\n.pc-table th:nth-child(2),.pc-table td:nth-child(2){min-width:72px;width:72px}\n.pc-table td:nth-child(2) input{min-width:56px}'
          if css not in t:
              raise SystemExit('css anchor missing')
          if 'min-width:72px' not in t:
              t = t.replace(css, add, 1)
          p.write_text(t, encoding='utf-8')
          print('ok', 'min-width:72px' in t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Widen Price Check nights column"
          git push
