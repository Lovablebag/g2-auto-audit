name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove checklist from price
        run: |
          curl -fsSL -o index.json "https://tmpfiles.org/dl/1793880705.ab0b5686f997875b/waA6JRJiNvRt/index.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('index.json').read_text())['html']
          if 's8-checklist-pc' in page: raise SystemExit('still there')
          Path('index.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Price Check: remove checklist, keep it only on the audit review"
          git push
