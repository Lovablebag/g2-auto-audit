name: Update prebuy page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show all offers
        run: |
          curl -fsSL -o region.json "https://tmpfiles.org/dl/1793878962.b48210ff12be22d1/wNAbJgJMe6eL/region.json"
          python3 - << 'PY'
          import json
          from pathlib import Path
          page = json.loads(Path('region.json').read_text())['html']
          if 'Showing 30' in page: raise SystemExit('still truncated')
          Path('region.html').write_text(page)
          print('wrote', len(page))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region.html
          git diff --cached --quiet || git commit -m "Region: show all offers, no truncation"
          git push
