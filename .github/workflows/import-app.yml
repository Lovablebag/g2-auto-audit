name: Import app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Auto Audit HTML
        run: |
          curl -L --fail -o index.html "https://litter.catbox.moe/eq73m8.html"
          wc -c index.html
          head -c 80 index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Auto Audit v4.4 app"
          git push
